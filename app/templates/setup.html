{% extends "bare.html" %}
{% block title %}初始化{% endblock %}
{% block content %}
  <p class="muted">首次使用请设置管理密码（至少 10 位）。这个密码只用于登录本页，不参与证书私钥加密。</p>
  <form method="post" action="/setup" class="stack">
    <label>管理密码
      <input type="password" name="password" minlength="10" required autofocus>
    </label>
    <label>确认密码
      <input type="password" name="password_confirm" minlength="10" required>
    </label>
    <button type="submit" class="primary">保存并进入登录页</button>
  </form>
{% endblock %}
